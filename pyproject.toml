[project]
name = "resume-assist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveen Manjappa", email = "122058418+NaveenManjappa@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.30.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
resume-assist = "resume_assist:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
